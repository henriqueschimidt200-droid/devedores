name: Gerar APK Devedores

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar Devedores
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos na raiz:"
          ls -la

          echo ""
          echo "Pasta app:"
          ls -la app || true

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        run: |
          echo "APK encontrado:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Devedores-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
